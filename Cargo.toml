[package]
name = "linger"
version = "0.1.0"
edition = "2021"
description = "XSMP-style app persistence for Wayland, backed by systemd --user"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
zbus = "5"

[profile.release]
lto = true
strip = true
